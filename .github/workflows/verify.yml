name: Verify established Supabase application
on:
  push:
    branches: [main, 'fix/**']
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm
      - run: npm ci --legacy-peer-deps --no-audit --no-fund
      - run: npm run lint
      - run: npm run test:all
      - run: npm run build

  journey-visual:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm
      - run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Install Chromium for journey renderer
        run: npx playwright install --with-deps chromium
      - name: Start local fixture web app
        shell: bash
        env:
          VITE_OWNER_PORTAL_ORIGIN: http://127.0.0.1:8082
          VITE_SUPABASE_URL: https://renderer.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_renderer_fixture
        run: |
          nohup npx vite --host 127.0.0.1 --port 8082 > journey-vite.log 2>&1 &
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:8082/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat journey-vite.log
          exit 1
      - name: Render complete customer journey
        env:
          QA_URL: http://127.0.0.1:8082
          QA_SCREENSHOT_DIR: artifacts/customer-journey
        run: node scripts/qa-customer-journey-renderer.mjs
      - name: Upload customer journey evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: theplugos-customer-journey-${{ github.sha }}
          path: |
            artifacts/customer-journey
            journey-vite.log
          if-no-files-found: error
          retention-days: 14
          compression-level: 6

  android-debug:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@v4
      - run: sdkmanager "platforms;android-36"
      - run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Build Android debug host
        shell: bash
        run: |
          set -o pipefail
          npm run android:sync
          set +e
          ./android/gradlew -p android :app:assembleDebug --stacktrace --console=plain 2>&1 | tee android-build.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            {
              echo "### Android build failure"
              echo '```text'
              grep -E "FAILURE:|What went wrong|Execution failed|^e: |error:|Caused by:|Exception|FAILED" android-build.log | tail -120 || tail -120 android-build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            summary=$(grep -E "Execution failed|^e: |error:|Caused by:" android-build.log | tail -1 | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')
            echo "::error title=Android debug build failed::${summary:-See Android build job summary for bounded Gradle diagnostics.}"
            exit "$status"
          fi
      - name: Record Android debug checksum
        shell: bash
        run: |
          apk="android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$apk"
          sha256sum "$apk" | tee "$apk.sha256"
          digest=$(cut -d' ' -f1 "$apk.sha256")
          {
            echo "### Android debug artifact"
            echo "\`app-debug.apk\` SHA-256: \`$digest\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Android debug artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: theplugos-android-debug-${{ github.sha }}
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
