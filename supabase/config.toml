# Native Hub endpoints authenticate with a signed device proof, not a browser
# Supabase JWT.  JWT verification must therefore be disabled *only* for these
# three endpoints; each handler performs strict request, proof, scope, and
# service-RPC validation before it mutates any server fact.
#
# This config is staging-only until the R001 clone and R002/R003 rehearsals are
# accepted. It is not deployment authorization.

[functions.hub-enrollment]
verify_jwt = false

[functions.hub-staff-session]
verify_jwt = false

# The native owner-authorized credential-reset receiver proves the enrolled
# Hub's Keystore key itself. It must not accept a browser JWT or CORS request.
[functions.hub-staff-credential-reset]
verify_jwt = false

[functions.hub-sync]
verify_jwt = false

# A branch terminal proves possession of its Android Keystore key against a
# short-lived owner-issued code.  It has no browser Origin and no Supabase JWT;
# the handler validates request bounds, rate limits, signed proof, scope, and
# service-only RPC results before it stores any authority fact.
[functions.hub-terminal-enrollment]
verify_jwt = false

# A terminal must prove its existing Android Keystore key, active signed
# admission, branch/Hub binding, and a fresh native PIN. There is no browser
# Origin or Supabase JWT in this path, so default JWT verification remains
# disabled only while the receiver performs those checks itself.
[functions.hub-terminal-staff-session]
verify_jwt = false

# The owner endpoint validates a normal Supabase user JWT and additionally
# checks the owner/business/branch relationship through a service-only RPC.
[functions.hub-owner-enrollment]
verify_jwt = true
